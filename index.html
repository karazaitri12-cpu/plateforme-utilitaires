<style>
  .mm-game-container {
    font-family: Arial, sans-serif;

  #mm-gameBoard {
    display: flex;

    gap: 5px;
  }
  .mm-board {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .mm-guess-row, .mm-secret-code-row {
    display: flex;

  }

  .mm-feedback-hole {

  .mm-color-picker {
    display: flex;

  .mm-attempts {

<script>
(function(){
  const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
  const codeLength = 4;
  const maxAttempts = 10;
  let secretCode = [];
  let currentGuess = [];
  let attempts = 0;
  let currentRow = 0;
  let gameEnded = false;
  // Sélecteurs avec préfixe pour éviter les conflits
  const gameBoard = document.getElementById('mm-gameBoard');
  const colorPicker = document.getElementById('mm-colorPicker');
  const attemptsDisplay = document.getElementById('mm-attempts');
  const secretCodeContainer = document.querySelector('.mm-secret-code-container');
  const secretCodeRow = document.getElementById('mm-secretCodeRow');
  const newGameBtn = document.getElementById('mm-newGameBtn');
  const restartGameBtn = document.getElementById('mm-restartGameBtn');
  const gameEndMessage = document.getElementById('mm-gameEndMessage');
  const rulesBtn = document.getElementById('mm-rulesBtn');

  function initGame() {
    secretCode = Array.from({length: codeLength}, () => colors[Math.floor(Math.random() * colors.length)]);
    renderBoard();
    renderColorPicker();
    updateAttempts();
    gameEnded = false;
    gameEndMessage.style.display = 'none';
    restartGameBtn.style.display = 'none';
    secretCodeContainer.style.display = 'none';
    currentGuess = [];
    attempts = 0;
    currentRow = 0;
  }

  function renderBoard() {
    gameBoard.innerHTML = '';
    for (let i = maxAttempts - 1; i >= 0; i--) {
      const row = document.createElement('div');
      row.className = 'mm-board';

      const guessRow = document.createElement('div');
      guessRow.className = 'mm-guess-row';

      for (let j = 0; j < codeLength; j++) {
        const hole = document.createElement('div');
        hole.className = 'mm-hole';
        hole.dataset.row = i;
        hole.dataset.col = j;
        hole.addEventListener('dblclick', () => removeColorFromHole(hole));
        guessRow.appendChild(hole);
      }
      row.appendChild(guessRow);

      const feedbackRow = document.createElement('div');
      feedbackRow.className = 'mm-feedback-row';

      for (let j = 0; j < codeLength; j++) {
        const feedbackHole = document.createElement('div');
        feedbackHole.className = 'mm-feedback-hole';
        feedbackRow.appendChild(feedbackHole);
      }
      row.appendChild(feedbackRow);
      gameBoard.appendChild(row);
    }
  }

  function renderColorPicker() {
    colorPicker.innerHTML = '';
    colors.forEach(color => {
      const colorElement = document.createElement('div');
      colorElement.className = 'mm-color';
      colorElement.style.backgroundColor = color;
      colorElement.addEventListener('click', () => selectColor(color));
      colorPicker.appendChild(colorElement);
    });
  }

  function selectColor(color) {
    if (gameEnded) return;
    if (currentGuess.length < codeLength) {
      currentGuess.push(color);
      const holes = document.querySelectorAll(`.mm-hole[data-row="${currentRow}"]`);
      holes[currentGuess.length - 1].style.backgroundColor = color;

      if (currentGuess.length === codeLength) {
        checkGuess();
      }
    }
  }

  function removeColorFromHole(hole) {
    if (gameEnded || parseInt(hole.dataset.row) !== currentRow) return;
    const index = parseInt(hole.dataset.col);
    if (index < currentGuess.length) {
      currentGuess.splice(index, 1);
      hole.style.backgroundColor = '#8b4513';
      // Reset colors for the remaining holes
      const holes = document.querySelectorAll(`.mm-hole[data-row="${currentRow}"]`);
      for (let i = index + 1; i < holes.length; i++) {
        holes[i].style.backgroundColor = '#8b4513';
      }
      // Reapply colors for the updated guess
      for (let i = 0; i < currentGuess.length; i++) {
        holes[i].style.backgroundColor = currentGuess[i];
      }
    }
  }

  function checkGuess() {
    attempts++;
    updateAttempts();
    const result = evaluateGuess();
    displayFeedback(result);

    if (result.correctPositions === codeLength) {
      endGame(`Félicitations! Vous avez gagné en ${attempts} essais!`);
    } else if (attempts >= maxAttempts) {
      endGame(`Désolé, vous avez épuisé vos ${maxAttempts} essais.`);
    } else {
      currentGuess = [];
      currentRow++;
    }
  }

  function evaluateGuess() {
    let correctPositions = 0;
    let correctColors = 0;
    const codeCopy = [...secretCode];
    const guessCopy = [...currentGuess];

    for (let i = 0; i < codeLength; i++) {
      if (guessCopy[i] === codeCopy[i]) {
        correctPositions++;
        codeCopy[i] = null;
        guessCopy[i] = null;
      }
    }
    for (let i = 0; i < codeLength; i++) {
      if (guessCopy[i] !== null) {
        const index = codeCopy.indexOf(guessCopy[i]);
        if (index !== -1) {
          correctColors++;
          codeCopy[index] = null;
        }
      }
    }
    return { correctPositions, correctColors };
  }

  function displayFeedback({ correctPositions, correctColors }) {
    const feedbackHoles = document.querySelectorAll(`.mm-board:nth-child(${maxAttempts - currentRow}) .mm-feedback-hole`);
    let index = 0;
    for (let i = 0; i < correctPositions; i++) {
      feedbackHoles[index].style.backgroundColor = '#000000'; // Noir
      index++;
    }
    for (let i = 0; i < correctColors; i++) {
      feedbackHoles[index].style.backgroundColor = '#ffffff'; // Blanc
      index++;
    }
  }

  function revealSecretCode() {
    secretCodeContainer.style.display = 'block';
    secretCodeRow.innerHTML = '';
    for (let i = 0; i < codeLength; i++) {
      const secretHole = document.createElement('div');
      secretHole.className = 'mm-secret-hole';
      secretHole.style.backgroundColor = secretCode[i];
      secretCodeRow.appendChild(secretHole);
    }
  }

  function updateAttempts() {
    attemptsDisplay.textContent = `Essais: ${attempts} / ${maxAttempts}`;
  }

  function endGame(message) {
    gameEnded = true;
    gameEndMessage.textContent = message;
    gameEndMessage.style.display = 'block';
    restartGameBtn.style.display = 'block';
    revealSecretCode();
  }

  function showRules() {
    alert("Règles du Mastermind:\n\n" +
          "1. Le but du jeu est de deviner le code secret composé de 4 couleurs.\n" +
          "2. Vous avez 10 essais pour trouver le code.\n" +
          "3. Après chaque essai, vous recevez des indices :\n" +
          "   - Un pion noir signifie une couleur correcte à la bonne position.\n" +
          "   - Un pion blanc signifie une couleur correcte mais mal placée.\n" +
          "4. Utilisez ces indices pour déduire le code secret.\n" +
          "5. Gagnez en trouvant le code exact avant d'épuiser vos essais !\n" +
          "6. Vous pouvez annuler une couleur en double-cliquant sur elle dans la rangée actuelle.");
  }

  newGameBtn.addEventListener('click', initGame);
  restartGameBtn.addEventListener('click', initGame);
  rulesBtn.addEventListener('click', showRules);

  initGame();
})();
</script>
